# Análisis de calidad con SonarQube desde un agente self-hosted (bloque 5 del vídeo).
# Se ejecuta en NUESTRO ordenador porque SonarQube está en el servidor de la UCLM, dentro
# de su red: solo se llega con la VPN de la universidad, y los agentes de Microsoft no pueden.
# Si el servidor no responde (p. ej. sin VPN), el análisis se SALTA con un aviso y el
# pipeline sigue: no falla por un problema de red.
#
# Vale para un agente en macOS o en Windows:
#   - Los pasos usan "script" (bash en macOS, cmd en Windows) y tareas de Azure, sin cp/rm.
#   - Maven se lanza con ./mvnw en macOS y con mvnw.cmd en Windows (condición por Agent.OS).
#
# Requisitos en el ordenador donde corre el agente:
#   - JDK 25, Node 22 y Docker Desktop arrancado (los tests usan Testcontainers)
#   - sonar-scanner en el PATH
#       macOS:   brew install sonar-scanner
#       Windows: descargar el zip de SonarScanner CLI y añadir su carpeta bin al PATH
#   - VPN de la UCLM conectada
# Variables secretas en Azure (Pipelines → Edit → Variables → Keep this value secret):
#   - SQ_TOKEN: token de SonarQube
#   - RENDER_DEPLOY_HOOK_BACKEND y RENDER_DEPLOY_HOOK_FRONTEND: Deploy Hook de cada servicio de Render
#     (Render → servicio → Settings → Deploy Hook). Ver docs/despliegue/render.md.
#
# Despliegue continuo (CD): en main, si los tests pasan y los dos proyectos superan el Quality Gate,
# el stage Desplegar pide a Render que despliegue el backend y el frontend. Render no despliega por su
# cuenta (autoDeployTrigger: off en render.yaml): solo lo hace cuando se lo pide este pipeline.

trigger:
  # Si se acumulan varias fusiones mientras no hay ningún agente conectado,
  # se lanza UNA sola ejecución con el último estado en vez de una por fusión.
  batch: true
  branches:
    include:
      - develop
      - main

pr: none            # Las PRs ya las valida azure-pipelines.yml; este pipeline solo analiza lo integrado.

variables:
  # Dónde está SonarQube: el servidor de la asignatura (red de la UCLM / VPN).
  # Para probar con un SonarQube local en Docker: http://localhost:9000
  SQ_URL: http://seralu4.esi.uclm.es:1521

# Pool de agentes propios del equipo. Lo ejecuta cualquier agente conectado del pool
# (cada miembro puede registrar el suyo). Los agentes de Microsoft están en otro pool,
# así que aquí solo entran los nuestros. Para forzar un agente concreto:
#   demands:
#     - agent.name -equals MacBook-Air-de-Jorge
pool:
  name: Default

stages:
  # 1 ─────────────────────────────────────────────────────────────
  - stage: Preparar
    displayName: Preparar
    jobs:
      - job: entorno
        displayName: Comprobar herramientas del agente
        steps:
          - checkout: self
            fetchDepth: 0            # Sonar necesita el historial para el "blame" y el código nuevo
          - script: java -version
            displayName: Java
          - script: node --version
            displayName: Node
          - script: docker version
            displayName: Docker
          - script: sonar-scanner --version
            displayName: sonar-scanner

  # 2 ─────────────────────────────────────────────────────────────
  - stage: Compilar
    displayName: Compilar y testear
    dependsOn: Preparar
    jobs:
      - job: backend
        displayName: Backend (Maven)
        steps:
          - checkout: self
          - script: ./mvnw -B verify
            displayName: Compilar, tests y cobertura JaCoCo (macOS)
            workingDirectory: backend
            condition: and(succeeded(), ne(variables['Agent.OS'], 'Windows_NT'))
          - script: mvnw.cmd -B verify
            displayName: Compilar, tests y cobertura JaCoCo (Windows)
            workingDirectory: backend
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))
          - publish: backend/target
            artifact: backend-target
            displayName: Guardar clases e informe de cobertura

      - job: frontend
        displayName: Frontend (Vite)
        steps:
          - checkout: self
          # Un step por comando: en Windows npm es un .cmd y encadenarlos en cmd no es fiable.
          - script: npm ci
            displayName: Instalar dependencias
            workingDirectory: frontend
          - script: npm run lint
            displayName: Lint
            workingDirectory: frontend
          - script: npm run test:coverage
            displayName: Tests con cobertura
            workingDirectory: frontend
          - script: npm run build
            displayName: Build
            workingDirectory: frontend
          - publish: frontend/coverage
            artifact: frontend-coverage
            displayName: Guardar informe de cobertura
          - publish: frontend/dist
            artifact: frontend-dist
            displayName: Guardar build del frontend

  # 3 ─────────────────────────────────────────────────────────────
  - stage: Analizar
    displayName: Analizar con SonarQube
    dependsOn: Compilar
    jobs:
      - job: sonar
        displayName: sonar-scanner
        steps:
          - checkout: self
            fetchDepth: 0
          # Recupera los resultados del stage Compilar en las carpetas donde los busca Sonar.
          - task: DownloadPipelineArtifact@2
            displayName: Recuperar clases y cobertura del backend
            inputs:
              artifact: backend-target
              path: $(Build.SourcesDirectory)/backend/target
          - task: DownloadPipelineArtifact@2
            displayName: Recuperar cobertura del frontend
            inputs:
              artifact: frontend-coverage
              path: $(Build.SourcesDirectory)/frontend/coverage

          # ¿Se llega al servidor? Si no responde, este paso queda en naranja (aviso),
          # el job pasa a "SucceededWithIssues", los dos análisis de abajo se saltan y no se despliega.
          - script: curl -sSf -m 15 $(SQ_URL)/api/system/status
            displayName: Comprobar que SonarQube responde (¿VPN conectada?)
            continueOnError: true

          # El token llega de la variable secreta SQ_TOKEN (en los logs sale como ***).
          # El -D de la línea de comandos tiene prioridad sobre el sonar.token de
          # sonar-project.properties, que solo está ahí para los análisis en local.
          # -Dsonar.qualitygate.wait=true: el paso espera al Quality Gate y falla si no se pasa, así que
          # el pipeline se para y no se despliega. El frontend se analiza aunque el backend no pase el
          # Quality Gate (estado Failed), para tener siempre los resultados de los dos proyectos; sin
          # VPN (SucceededWithIssues) se salta igual que el backend.
          - script: sonar-scanner -Dsonar.host.url=$(SQ_URL) -Dsonar.token=$(SQ_TOKEN) -Dsonar.qualitygate.wait=true
            displayName: Analizar backend (y esperar al Quality Gate)
            workingDirectory: backend
            condition: eq(variables['Agent.JobStatus'], 'Succeeded')
          - script: sonar-scanner -Dsonar.host.url=$(SQ_URL) -Dsonar.token=$(SQ_TOKEN) -Dsonar.qualitygate.wait=true
            displayName: Analizar frontend (y esperar al Quality Gate)
            workingDirectory: frontend
            condition: and(not(canceled()), in(variables['Agent.JobStatus'], 'Succeeded', 'Failed'))

  # 4 ─────────────────────────────────────────────────────────────
  - stage: Desplegar
    displayName: Desplegar
    dependsOn: Analizar       # Si el análisis falla, este stage no se ejecuta: no se despliega.
    jobs:
      - job: entrega
        displayName: Publicar entregables
        steps:
          - checkout: none
          - download: current
            artifact: backend-target
          - download: current
            artifact: frontend-dist
          - task: CopyFiles@2
            displayName: Copiar el .jar del backend
            inputs:
              SourceFolder: $(Pipeline.Workspace)/backend-target
              Contents: '*.jar'
              TargetFolder: $(Build.ArtifactStagingDirectory)/esibuy
          - task: CopyFiles@2
            displayName: Copiar el build del frontend
            inputs:
              SourceFolder: $(Pipeline.Workspace)/frontend-dist
              Contents: '**'
              TargetFolder: $(Build.ArtifactStagingDirectory)/esibuy/frontend
          - publish: $(Build.ArtifactStagingDirectory)/esibuy
            artifact: esibuy-release
            displayName: Publicar versión lista para desplegar

      # Despliegue en Render. Solo en main y solo si el análisis se hizo de verdad y pasó el Quality Gate
      # (resultado Succeeded): sin VPN el análisis se salta (SucceededWithIssues) y no se despliega.
      # Render construye cada servicio desde el commit de main y no le manda tráfico hasta que pasa
      # su health check; el resultado del despliegue se ve en el panel de Render.
      - job: render
        displayName: Desplegar en Render
        condition: and(eq(stageDependencies.Analizar.sonar.result, 'Succeeded'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        steps:
          - checkout: none
          # Las URL de los Deploy Hooks son secretas: salen de variables secretas (en los logs, ***).
          - script: curl -fsS -m 30 -X POST "$(RENDER_DEPLOY_HOOK_BACKEND)"
            displayName: Pedir a Render que despliegue el backend
          - script: curl -fsS -m 30 -X POST "$(RENDER_DEPLOY_HOOK_FRONTEND)"
            displayName: Pedir a Render que despliegue el frontend
