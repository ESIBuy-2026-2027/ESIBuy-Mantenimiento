# Must be unique in a given SonarQube instance
sonar.host.url=http://seralu4.esi.uclm.es:1521/
sonar.projectKey=2026-g02-backend
sonar.projectName=2026-g02-backend
sonar.projectVersion=1.0
# El token NO va aquí: se pasa con la variable de entorno SONAR_TOKEN
# (en local: export SONAR_TOKEN=... ; en Azure: variable secreta SQ_TOKEN)

# Código y tests
sonar.sources=src/main
sonar.tests=src/test
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Cobertura generada por "./mvnw verify" (JaCoCo). Ruta relativa, sin "/" inicial.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
