spring.application.name=backend

# Conexión a MongoDB Atlas (T212). La URI con credenciales NUNCA va en el repositorio:
# se lee de la variable de entorno MONGODB_URI de cada desarrollador.
# Si la variable no existe, la aplicación no arranca ("connection string is invalid").
# Los tests no usan Atlas: importan MongoTestcontainersConfig (MongoDB en Docker).
spring.mongodb.uri=${MONGODB_URI}
# Nombre exacto de la base ya creada en Atlas: MongoDB no admite dos bases que solo difieran
# en mayúsculas, así que "esibuy" fallaría al existir "EsiBuy".
spring.mongodb.database=EsiBuy

# Las colecciones, su validación y sus índices (también los de las anotaciones de los @Document) los
# crea InicializadorColecciones al arrancar (T210). Si Spring creara los índices por su cuenta, crearía
# antes la colección sin su validación.
spring.data.mongodb.auto-index-creation=false

# Envío de correo por SMTP con Brevo (T231). Host y puerto de la pestaña SMTP de Brevo.
# El puerto se cambia con ESIBUY_MAIL_PUERTO: en Render (plan gratuito) están bloqueados el 25, el 465 y el 587, y allí
# se usa el 2525, que Brevo también admite con STARTTLS.
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=${ESIBUY_MAIL_PUERTO:587}
# Usuario: el login SMTP de Brevo (...@smtp-brevo.com), NO el correo del remitente.
spring.mail.username=c27311001@smtp-brevo.com

# SMTP key de Brevo (pestaña SMTP). Solo en la variable de entorno BREVO_SMTP_KEY de cada desarrollador y del
# despliegue: nunca en el repositorio. Sin ella la aplicación no arranca; los tests usan una falsa
# (MongoTestcontainersConfig) y nunca envían correo real.
spring.mail.password=${BREVO_SMTP_KEY}
# Cifrado obligatorio (STARTTLS) y timeouts de 5 s: sin ellos, JavaMail puede quedarse esperando indefinidamente.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remitente de los correos (T230, D8). Tiene que ser el remitente verificado en Brevo.
esibuy.mail.remitente=ESIBuy <esibuy.notificaciones@gmail.com>

# Clave AES-256 (Base64) con la que se cifra el secreto TOTP en MongoDB (T20, D3).
# Solo en la variable de entorno ESIBUY_TOTP_CLAVE_CIFRADO (32 bytes en Base64, `openssl rand -base64 32`): nunca en
# el repositorio. Sin ella la aplicación no arranca; los tests usan una aleatoria (MongoTestcontainersConfig).
esibuy.totp.clave-cifrado=${ESIBUY_TOTP_CLAVE_CIFRADO}

# Clave AES-256 (Base64, 32 bytes) con la que se cifran los datos de pago en MongoDB (HU6). Distinta de la
# del TOTP y solo en la variable de entorno ESIBUY_PAGOS_CLAVE_CIFRADO de cada desarrollador: nunca en el
# repositorio. Se genera con `openssl rand -base64 32`. Sin ella la aplicación no arranca; los tests usan una
# aleatoria (MongoTestcontainersConfig).
esibuy.pagos.clave-cifrado=${ESIBUY_PAGOS_CLAVE_CIFRADO}

# API key de VirusTotal (API pública v3) para el análisis antivirus de las URL de las imágenes de producto (HU31,
# T397). Solo en la variable de entorno VIRUSTOTAL_API_KEY de cada desarrollador (cuenta gratuita de virustotal.com):
# nunca en el repositorio. Sin ella la aplicación no arranca; los tests usan una falsa (MongoTestcontainersConfig) y
# nunca llaman a VirusTotal.
esibuy.virustotal.api-key=${VIRUSTOTAL_API_KEY}

# Sesión (HU43, T319): caduca tras 15 minutos sin actividad; se cambia con la variable de entorno
# ESIBUY_SESION_INACTIVIDAD (p. ej. 30m). La cookie JSESSIONID solo viaja por HTTPS (Secure), el JavaScript
# no puede leerla (HttpOnly) y el navegador no la envía desde otros sitios (SameSite=Strict). En local,
# los navegadores tratan http://localhost como seguro, así que Secure no impide desarrollar.
server.servlet.session.timeout=${ESIBUY_SESION_INACTIVIDAD:15m}
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Health check para Render. Solo se expone el endpoint health, sin detalles de los componentes, y /actuator/health/liveness
# (healthCheckPath de Render) responde si el proceso vive sin consultar MongoDB. El indicador de correo se desactiva: haría
# ping al SMTP y, si el puerto estuviera bloqueado, dejaría todo el health en DOWN y Render reiniciaría el servicio.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# Despliegue detrás del proxy de Render, que termina el HTTPS. PORT lo inyecta Render (en local se usa el 8080) y
# forward-headers-strategy=native hace que Tomcat lea X-Forwarded-Proto y X-Forwarded-For, para que la aplicación sepa que
# la petición original era HTTPS.
server.port=${PORT:8080}
server.forward-headers-strategy=native
