#Exclusions to not be analyzed by SonarQube
#Mocks
sonar.exclusions=**/public/mockServiceWorker.js,**/src/mocks/**

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Source and test code (test files and helpers live next to the code in src)
