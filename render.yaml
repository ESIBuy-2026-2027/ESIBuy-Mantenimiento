# Despliegue continuo de ESIBuy en Render (Blueprint). Guía y pasos manuales: docs/despliegue/render.md.
# Los dos servicios se despliegan desde main, pero Render no lo hace por su cuenta (autoDeployTrigger: off): se lo pide
# el stage Desplegar del pipeline de Sonar (azure-pipelines-sonar.yml) con el Deploy Hook de cada servicio, después de
# que pasen los tests y el Quality Gate de SonarQube.
services:
  # Backend Spring Boot en contenedor (backend/Dockerfile). Plan gratuito: se duerme tras 15 minutos sin tráfico.
  - type: web
    name: esibuy-backend
    runtime: docker
    plan: free
    # Render no tiene región en París (donde está el clúster de Atlas, AWS eu-west-3): Fráncfort es la más cercana.
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Liveness: responde si el proceso vive, sin consultar MongoDB (ver application.properties).
    healthCheckPath: /actuator/health/liveness
    autoDeployTrigger: off
    envVars:
      # Secretos: Render pide su valor al crear el Blueprint y nunca se guardan en el repositorio.
      - key: MONGODB_URI
        sync: false
      - key: ESIBUY_PAGOS_CLAVE_CIFRADO
        sync: false
      - key: ESIBUY_TOTP_CLAVE_CIFRADO
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      # El plan gratuito bloquea los puertos 25, 465 y 587: Brevo también admite el 2525 con STARTTLS.
      - key: ESIBUY_MAIL_PUERTO
        value: "2525"
      # Límites de la JVM para los 512 MB del plan gratuito (en local la imagen usa unos 280 MiB con estos valores).
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC

  # Frontend React como sitio estático: Render ejecuta el build y sirve dist/ desde su CDN (no se duerme).
  - type: web
    name: esibuy
    runtime: static
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: off
    envVars:
      # La misma versión de Node que el CI. VITE_USE_MOCKS no se define: los mocks de MSW solo se activan en desarrollo.
      - key: NODE_VERSION
        value: "22"
    routes:
      # Las peticiones a /api van al backend con el mismo origen que el frontend: así las cookies de sesión y CSRF
      # (SameSite=Strict) funcionan sin CORS. RIESGO ABIERTO: Render no documenta si el rewrite deja pasar las cookies;
      # se comprueba en el primer despliegue (ver docs/despliegue/render.md, plan B).
      # La URL depende del nombre del servicio: si Render le añade un sufijo, hay que cambiarla aquí.
      - type: rewrite
        source: /api/*
        destination: https://esibuy-backend.onrender.com/api/*
      # Rutas de React (client-side routing): cualquier otra ruta sirve index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # El navegador no adivina el tipo de los archivos (evita que un recurso se ejecute como script).
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Nadie puede meter ESIBuy en un iframe (clickjacking).
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Al salir hacia otra web solo se envía el dominio, no la URL completa.
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
